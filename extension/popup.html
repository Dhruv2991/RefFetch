<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RefFetch</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, system-ui, sans-serif;
      background: #0B0A14;
      color: #EDEBF5;
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status, #paperStatus {
      font-size: 12px;
      color: #A9A4C4;
      margin-bottom: 10px;
      word-break: break-word;
      max-height: 60px;
      overflow-y: auto;
    }
    button {
      width: 100%;
      background: #7C5CFC;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #9B7FFF; }
    button:disabled { background: #2A2547; color: #6E6890; cursor: not-allowed; }
    button.secondary {
      background: #1A1730;
      color: #EDEBF5;
      font-weight: 500;
      margin-top: 8px;
      border: 1px solid #2A2547;
    }
    button.secondary:hover { background: #211C3D; }
    .msg { font-size: 12px; margin-top: 10px; padding: 8px; border-radius: 6px; }
    .msg.success { background: #16332E; color: #7FE8DC; }
    .msg.error { background: #3A1E2A; color: #F591AC; }
    .msg.hidden { display: none; }
    #userRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #A9A4C4;
      margin-bottom: 10px;
    }
    #signOutBtn {
      background: none;
      color: #A9A4C4;
      width: auto;
      padding: 0;
      font-size: 11px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>📚 RefFetch</h1>

  <div id="signedOutView">
    <p id="status">Sign in to save papers to your library.</p>
    <button id="signInBtn">Continue with Google</button>
  </div>

  <div id="signedInView" style="display: none">
    <div id="userRow">
      <span id="userEmail"></span>
      <button id="signOutBtn">Sign out</button>
    </div>
    <p id="paperStatus">Detecting paper on this page...</p>
    <button id="saveBtn" disabled>Save to library</button>
  </div>

  <div id="msg" class="msg hidden"></div>
  <script src="popup.js"></script>
</body>
</html>
