<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RefFetch</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, system-ui, sans-serif;
      background: #11151C;
      color: #EDEAE1;
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status {
      font-size: 12px;
      color: #9298A3;
      margin-bottom: 10px;
      word-break: break-word;
      max-height: 60px;
      overflow-y: auto;
    }
    button {
      width: 100%;
      background: #D9A441;
      color: #11151C;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #F0C168; }
    button:disabled { background: #262D3A; color: #5C6270; cursor: not-allowed; }
    button.secondary {
      background: #1F2530;
      color: #EDEAE1;
      font-weight: 500;
      margin-top: 8px;
    }
    button.secondary:hover { background: #252C38; }
    .msg { font-size: 12px; margin-top: 10px; padding: 8px; border-radius: 6px; }
    .msg.success { background: #17342C; color: #7FD8D0; }
    .msg.error { background: #3A1E1E; color: #E8A0A0; }
    .msg.hidden { display: none; }
    #userRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #9298A3;
      margin-bottom: 10px;
    }
    #signOutBtn {
      background: none;
      color: #9298A3;
      width: auto;
      padding: 0;
      font-size: 11px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>📚 RefFetch</h1>

  <div id="signedOutView">
    <p id="status">Sign in to save papers to your library.</p>
    <button id="signInBtn">Continue with Google</button>
  </div>

  <div id="signedInView" style="display: none">
    <div id="userRow">
      <span id="userEmail"></span>
      <button id="signOutBtn">Sign out</button>
    </div>
    <p id="paperStatus">Detecting paper on this page...</p>
    <button id="saveBtn" disabled>Save to library</button>
  </div>

  <div id="msg" class="msg hidden"></div>
  <script src="popup.js"></script>
</body>
</html>
